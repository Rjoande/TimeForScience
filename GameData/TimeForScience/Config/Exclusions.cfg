// TimeForScience exclusions.
//
// Add a TIMEFORSCIENCE_EXCLUSION node per experimentID you want to exclude
// from the timer and/or from Electric Charge consumption. This is also where
// TimeForScience's own stock defaults live (see below) - there is no
// separate hardcoded list in code, so removing or editing an entry here
// changes the actual behavior, including for the three stock experiments.
//
// Fields:
//   experimentID     - required, must match the experiment's id exactly.
//   excludeFromTimer - optional, default false. true = always instantaneous.
//   excludeFromEC    - optional, default false. true = never draws power,
//                      even if EC consumption is enabled in Difficulty Settings.

// Crew report/Visual observation: stays timed like everything else,
// but a kerbal writing notes doesn't run on ship power.
TIMEFORSCIENCE_EXCLUSION
{
	experimentID = crewReport
	excludeFromEC = true
}

TIMEFORSCIENCE_EXCLUSION
{
	experimentID = sspxVisualObservation
	excludeFromEC = true
}

// EVA report and surface sample: quick personal observations, not instrument
// runs (decision H) - instantaneous, and (moot but explicit) never draw power.
TIMEFORSCIENCE_EXCLUSION
{
	experimentID = evaReport
	excludeFromTimer = true
	excludeFromEC = true
}

TIMEFORSCIENCE_EXCLUSION
{
	experimentID = surfaceSample
	excludeFromTimer = true
	excludeFromEC = true
}

// Add custom/modded experimentIDs below the same way. Example (disabled -
// remove the leading // on each line to activate):
//
// TIMEFORSCIENCE_EXCLUSION
// {
// 	experimentID = someCustomExperimentId
// 	excludeFromTimer = true
// 	excludeFromEC = true
// }
//
// Note: an "EVAscience" experiment was requested but isn't a recognized
// stock/DMagic/Universal Storage 2 experimentID - if you have a specific
// mod's experimentID in mind, add it above.
