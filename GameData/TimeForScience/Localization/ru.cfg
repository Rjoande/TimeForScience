Localization
{
	ru
	{
		// Mod display name; reused wherever the mod itself needs to be named
		// (info dialogs, future Difficulty Settings section header).
		#LOC_T4S_ModName = Time For Science

		// Screen message when a timed observation begins. <<1>> = experiment name, <<2>> = estimated duration (e.g. "5:00" or "45s").
		#LOC_T4S_Started = Начинается: <<1>> (<<2>>)
		// PAW button label while an observation is in progress. <<1>> = time remaining (e.g. "1:23" or "45s").
		#LOC_T4S_Running = В процессе: <<1>>
		// PAW button label while a timed observation is waiting to return to its original conditions (situation/biome changed).
		#LOC_T4S_Paused = <<1>> приостановлен (неподходящая ситуация)
		// Screen message when a timed observation is cancelled because the vessel changed sphere of influence. <<1>> = experiment name.
		#LOC_T4S_AbortedSoIChange = <<1>> провален (слишком далеко)
		// Screen message when the player resets an experiment while a timed observation is still running. <<1>> = experiment name.
		#LOC_T4S_AbortedReset = <<1>> отменён
		// Deploy button label with a time estimate appended, shown before starting (idle state, no run yet). <<1>> = action name (e.g. "Observe Mystery Goo"), <<2>> = formatted duration (e.g. "3s", "5m", "2h").
		#LOC_T4S_ActionWithEstimate = <<1>> (<<2>>)
		// PAW button label for the explicit cancel control, visible only while a timed observation is active on that module.
		#LOC_T4S_Cancel = Отменить эксперимент
		// Inbox message title when a timed observation completes on a vessel that isn't loaded/active. <<1>> = experiment name.
		#LOC_T4S_InboxTitle = <<1>> завершён
		// Inbox message body for the same event. <<1>> = vessel name, <<2>> = experiment results text, <<3>> = science points gained.
		#LOC_T4S_InboxMessage = <<1>>: <<2>>\n\nПолучено <<3>> науки

		// Deploy button label with both a time and an Electric Charge cost estimate, shown before starting when EC consumption is enabled in Difficulty Settings. <<1>> = action name, <<2>> = formatted duration, <<3>> = total EC cost (e.g. "4.5").
		#LOC_T4S_ActionWithEstimateEC = <<1>> (<<2>>, <<3>> ЭЭ)
		// Same as above, but shown instead when the "show EC as rate" Difficulty Setting is on. <<1>> = action name, <<2>> = formatted duration, <<3>> = EC/s rate (e.g. "0.45").
		#LOC_T4S_ActionWithEstimateECRate = <<1>> (<<2>>, <<3>> ЭЭ/с)
		// PAW button label while an observation is running but only partially powered (EC consumption enabled, not enough charge available). <<1>> = time remaining, <<2>> = current power availability as a percentage (e.g. "43").
		#LOC_T4S_RunningLowPower = В процессе: <<1>> (нехватка ЭЭ, запитан на <<2>>%)
		// PAW button label while a run is active elsewhere on the module but the vessel is currently over a different, still-valuable biome (same situation) - time here is being banked instead of wasted. Static text, no countdown; the "Banked biomes" PAW group carries the detail.
		#LOC_T4S_Banking = Данные сохраняются (биом изменился)
		// Header of the collapsible PAW group listing banked biomes for this module.
		#LOC_T4S_BankingGroup = Сохранённые данные
		// Row in the "Banked biomes" group for the biome the run is actually deployed on right now - always listed first, marked with a leading ">". <<1>> = biome name, <<2>> = time remaining there (same countdown semantics as Running).
		#LOC_T4S_BankRowPrimary = > <<1>>: <<2>>
		// Row in the "Banked biomes" group for a biome accumulating progress opportunistically (not the one deployed on). <<1>> = biome name, <<2>> = time still needed there.
		#LOC_T4S_BankRow = <<1>>: <<2>>
		// Summary row replacing the last slot in the "Banked biomes" group when there are more banked biomes than fit (fixed-size pool). <<1>> = how many additional biomes aren't shown.
		#LOC_T4S_BankingMore = + <<1>>...

		// Difficulty Settings section title/header; reuses the mod name.
		// Difficulty Settings: checkbox toggling the optional Electric Charge consumption feature (off by default).
		#LOC_T4S_Settings_EnableEC = Эксперименты требуют ЭЭ
		#LOC_T4S_Settings_EnableEC_Tooltip = Эксперименты потребляют электричество при выполнении.
		// Difficulty Settings: slider for the EC/s-per-base-value multiplier (only relevant if the toggle above is on).
		#LOC_T4S_Settings_ECRate = Множитель потребления ЭЭ
		#LOC_T4S_Settings_ECRate_Tooltip = Потребление электроэнергии в секунду равно базовому количеству получаемых очков науки * этот параметр. Напр., магнетометр с базовым результатом 45 науки при уровне потребления 0.01 требует 0.45 ЭЭ/с.
		// Difficulty Settings: checkbox choosing how the idle Deploy-button estimate displays its EC cost (off by default). Independent of any specific power-management mod.
		#LOC_T4S_Settings_ECAsRate = Отображать потребляемую ЭЭ как секундный расход ЭЭ
		#LOC_T4S_Settings_ECAsRate_Tooltip = Отображать количество необходимой для эксперимента электроэнергии как секундный расход вместо общего количества.
		// Difficulty Settings: checkbox toggling banked progress on other biomes (off by default).
		#LOC_T4S_Settings_EnableBanking = Сохранять прогресс при смене биома
		#LOC_T4S_Settings_EnableBanking_Tooltip = Когда эксперимент находится в процессе и игрок оказывается в той же ситуации (полёт, на земле и т.д.) над другим биомом, данные из нового биома будут сохранены для будущих наблюдений. Если включено потребление ЭЭ, сохранение данных потребляет электроэнергию так же, как активные наблюдения.
	}
}
